name: 🐛 Bug Report
description: Report a bug in the app
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: "e.g. 1.2.0"
    validations:
      required: true
  - type: dropdown
    id: android-version
    attributes:
      label: Android Version
      options:
        - Android 15
        - Android 14
        - Android 13
        - Android 12
        - Older
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have checked that there isn't already an open issue about this
          required: true
